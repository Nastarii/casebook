[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "casebook-backend"
version = "0.1.0"
description = "Backend foundation for Casebook."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.5",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.6.1",
  "python-jose[cryptography]>=3.3.0",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.32.1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "ruff>=0.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
