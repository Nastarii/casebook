services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casebook
      POSTGRES_USER: casebook
      POSTGRES_PASSWORD: casebook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: casebook
      MINIO_ROOT_PASSWORD: casebook-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
